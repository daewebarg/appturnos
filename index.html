<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Turnos Médicos</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
   <div class="video-background">
    <video autoplay loop muted playsinline>
        <source src="/fondo.mp4 type="video/mp4">
    </video>
</div>
<div class="video-overlay"></div>
    <div class="container">
        <h2>Solicitud de Turno Médico</h2>
        <form id="turnoForm">
            
            <div class="form-group">
                <label for="nombre">Nombre y Apellido *</label>
                <input type="text" id="nombre" required placeholder="Ej: Roberto Correa">
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono de Contacto *</label>
                <input type="tel" id="telefono" required placeholder="Ej: 1126783034">
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico *</label>
                <input type="email" id="email" required placeholder="Ej: usuario@gmail.com">
            </div>

            <div class="form-group">
                <label for="servicio">Servicio / Consulta *</label>
                <select id="servicio" required>
                    <option value="">Seleccione un servicio...</option>
                    <option value="consulta-general" data-duracion="30">Consulta General (30 min)</option>
                    <option value="extraccion" data-duracion="15">Extracción de Sangre (15 min)</option>
                    <option value="control" data-duracion="20">Control Médico (20 min)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="obraSocial">Obra Social *</label>
                <select id="obraSocial" required>
                    <option value="">Seleccione...</option>
                    <option value="osde">OSDE</option>
                    <option value="swiss">Swiss Medical</option>
                    <option value="particular">Particular</option>
                </select>
            </div>

            <div class="form-group">
                <label for="plan">Plan *</label>
                <select id="plan" required disabled>
                    <option value="">Seleccione Obra Social</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fecha">Fecha del Turno *</label>
                <input type="date" id="fecha" required>
            </div>

            <div class="form-group">
                <label for="horario">Horarios Disponibles *</label>
                <select id="horario" required disabled>
                    <option value="">Seleccione fecha y servicio</option>
                </select>
            </div>

            <div class="form-group">
                <label for="comentarios">Notas o Comentarios Adicionales</label>
                <textarea id="comentarios" rows="3" placeholder="¿Algo que el profesional deba saber antes de tu visita?"></textarea>
            </div>

            <button type="submit" id="btnConfirmar" class="btn-submit">
                <span id="btnTexto">Confirmar Reserva</span>
            </button>

        </form>
    </div>

</body>
</html>
