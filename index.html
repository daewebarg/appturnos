<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reserva de Turnos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Reserva tu Turno</h2>
        
        <form id="turnoForm">
            
            <div class="grid-2">
                <div class="form-group">
                    <label for="nombre">Nombre y Apellido *</label>
                    <input type="text" id="nombre" required placeholder="Ej: Juan Pérez">
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono *</label>
                    <input type="tel" id="telefono" required placeholder="Ej: +549112345678">
                </div>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico *</label>
                <input type="email" id="email" required placeholder="ejemplo@correo.com">
            </div>

            <div class="grid-3">
                <div class="form-group">
                    <label for="servicio">Servicio *</label>
                    <select id="servicio" required>
                        <option value="">Seleccione...</option>
                        <option value="consulta" data-duracion="30">Consulta</option>
                        <option value="limpieza" data-duracion="45">Limpieza</option>
                        <option value="extraccion" data-duracion="120">Extracción</option>
                        <option value="control" data-duracion="30">Control</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="obraSocial">Obra Social *</label>
                    <select id="obraSocial" required>
                        <option value="">Seleccione...</option>
                        <option value="osde">OSDE</option>
                        <option value="swiss">Swiss Medical</option>
                        <option value="particular">Particular</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="plan">Plan *</label>
                    <select id="plan" required disabled>
                        <option value="">Seleccione Obra Social</option>
                    </select>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Fecha *</label>
                    <div id="calendario-contenedor" class="calendar-container">
                        <div id="calendar-grid" class="calendar-grid"></div>
                        <div class="leyenda">
                            <div class="leyenda-item"><span class="dot" style="background: #2ecc71;"></span>Alta</div>
                            <div class="leyenda-item"><span class="dot" style="background: #f1c40f;"></span>Media</div>
                            <div class="leyenda-item"><span class="dot" style="background: #e74c3c;"></span>Sin</div>
                        </div>
                    </div>
                    <input type="hidden" id="fecha" required>
                </div>
                <div class="form-group">
                    <label for="horario">Horarios Disponibles *</label>
                    <select id="horario" required disabled>
                        <option value="">Seleccione fecha y servicio</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="comentarios">Notas o comentarios adicionales</label>
                <textarea id="comentarios" rows="3" placeholder="¿Algo que el profesional deba saber antes de tu visita?"></textarea>
            </div>

            <button type="submit" id="btnConfirmar">Confirmar Reserva</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
